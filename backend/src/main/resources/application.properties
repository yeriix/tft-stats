spring.application.name=tftstats

# Load local secrets from the .env file in the repo root (ignored by git)
spring.config.import=optional:file:../.env[.properties]

riot.api-key=${RIOT_API_KEY:}
riot.regional-host=https://europe.api.riotgames.com
riot.platform-host=https://euw1.api.riotgames.com

spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE:tftstats}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:tftstats}
spring.datasource.password=${MYSQL_PASSWORD:}

# The schema is managed by Flyway, not by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
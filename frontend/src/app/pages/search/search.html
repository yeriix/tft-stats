<section class="hero">
  <h1>TFT Stats</h1>
  <p class="muted">Look up any Teamfight Tactics player: rank, top 4 rate and match history.</p>

  <form class="search-form" (ngSubmit)="search()">
    <input
      name="riotId"
      [(ngModel)]="riotId"
      placeholder="Riot ID (e.g. Name#EUW)"
      autocomplete="off"
    />
    <button type="submit" [disabled]="!riotId.trim()">Search</button>
  </form>

  @if (error()) {
    <p class="hint state error">{{ error() }}</p>
  }
</section>
